name: hopper
description: "Hop onto your Android phone over Wi-Fi. No cable. No commands."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  multicast_dns: ^0.3.2+7
  qr_flutter: ^4.1.0
  window_manager: ^0.3.9
  tray_manager: ^0.2.3
  desktop_drop: ^0.9.2
  win32: ^5.5.4
  ffi: ^2.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  crypto: ^3.0.3
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bin/
    - assets/fonts/
    - assets/icons/
